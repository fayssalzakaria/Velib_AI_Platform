name: daily-fallback

# Job quotidien de SECOURS : compaction Delta (OPTIMIZE + VACUUM), modèles gold dbt, puis embeddings.
# Le principal est le DAG Airflow velib_daily_gold (13:15, heure de Paris), qui écrit
# lake/_control/daily/<date>.json. Ici (21:30 à Paris en été, 20:30 en hiver : le cron GitHub est
# en UTC) on ne relance rien si le marqueur existe.
# Le gold n'est pas recalculé chaque heure pour limiter la sortie de données S3.
on:
  schedule:
    - cron: "30 19 * * *"
  workflow_dispatch:
    inputs:
      backfill:
        description: "Importer d'abord les anciens CSV (velib/history, velib/data)"
        type: boolean
        default: false

permissions:
  id-token: write
  contents: read

concurrency:
  group: velib-lake-writer
  cancel-in-progress: false

jobs:
  maintain-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      LAKE_ROOT: s3://${{ vars.S3_BUCKET }}/lake
      AWS_REGION: ${{ vars.AWS_REGION }}
      PIPELINE_ORCHESTRATOR: github-actions
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - run: pip install -r pipeline/requirements.txt

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # Lancement manuel : on force. Lancement planifié : seulement si Airflow n'est pas passé.
      - name: Airflow a-t-il déjà fait le job du jour ?
        id: check
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] && python -m pipeline.control is-done daily; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Backfill des snapshots v1
        if: ${{ inputs.backfill }}
        run: python -m pipeline.run backfill

      - name: OPTIMIZE + VACUUM silver
        if: steps.check.outputs.skip != 'true'
        run: python -m pipeline.run maintain

      - name: dbt build (gold + tests qualité)
        if: steps.check.outputs.skip != 'true'
        working-directory: dbt
        run: dbt build --profiles-dir . --target prod

      # Embeddings des profils calculés ici, une fois par jour : l'application n'encode
      # plus que la question de l'utilisateur
      - name: Cache des modèles Hugging Face
        if: steps.check.outputs.skip != 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ hashFiles('src/ai/embeddings.py') }}

      - name: Embeddings des profils de stations (+ Qdrant)
        if: steps.check.outputs.skip != 'true'
        env:
          QDRANT_URL: ${{ secrets.QDRANT_URL }}
          QDRANT_API_KEY: ${{ secrets.QDRANT_API_KEY }}
        run: |
          pip install -r pipeline/requirements-embed.txt
          python -m pipeline.run embed

      - name: Données externes (météo, vacances scolaires)
        if: steps.check.outputs.skip != 'true'
        run: python -m pipeline.run external

      - name: Monitoring du modèle (prévisions passées vs réalité, dérive)
        if: steps.check.outputs.skip != 'true'
        run: python -m pipeline.run monitor

      - name: Marqueur de fin
        if: steps.check.outputs.skip != 'true'
        run: python -m pipeline.control mark-done daily
