name: oidc-debug

# Diagnostic temporaire : affiche les claims du jeton OIDC que GitHub présente à AWS
# (sub, aud, repository). Le jeton lui-même n'est jamais affiché.
on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  claims:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken("sts.amazonaws.com");
            const claims = JSON.parse(Buffer.from(token.split(".")[1], "base64url").toString());
            for (const key of ["sub", "aud", "repository", "repository_owner", "ref", "event_name"]) {
              core.info(`${key} = ${claims[key]}`);
            }
